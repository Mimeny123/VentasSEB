<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevos Posteos - Ventas SEB</title>
    <link rel="stylesheet" href="nuevosPosteos.css">
</head>
<body>
<main>
    <section class="seccionPosteos">
        <h2>Crear Nuevo Posteo</h2>
        
        <form action="insertPosteos.php" method="POST">
            <div class="gridFCPosteos">
                <div class="divIMG">
                    <div class="inputPost">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbnNasVJoAtIiZotw2Jrb7q7l_MOp26mSfFwYUuX4EQg&s=10" alt="Vista previa">
                        <input type="url" id="imagen" name="imagen" maxlength="400" placeholder="https://ejemplo.com/foto.jpg">
                    </div>
                </div>

                <div class="divTPM">
                    <div class="divTitulo">
                        <div class="inputPost">
                            <label for="titulo">Título de la publicación:</label>
                            <input type="text" id="titulo" name="titulo" maxlength="320" required placeholder="Un Titulo Llamativo">
                        </div>
                    </div>

                    <div class="divPrecio">
                        <div class="inputPost">
                            <label for="precio">Precio:</label>
                            <input type="number" id="precio" name="precio" min="0" required placeholder="($ ARS)">
                        </div>
                    </div>

                    <div class="divAlias">
                        <div class="inputPost">
                            <label for="mp">Alias / Cuenta MercadoPago:</label>
                            <input type="text" id="mp" name="mp" maxlength="60" placeholder="mi.alias.mp">
                        </div>
                    </div>
                </div>
            </div>

            <input type="hidden" name="usuario_id" value="1">

            <div class="divDB">
                <div class="divDescrip">
                    <div class="inputPost">
                        <label for="descripcion">Descripción detallada:</label>
                        <textarea id="descripcion" name="descripcion" rows="5" placeholder="Detalles del producto, medidas, etc."></textarea>
                    </div>
                </div>

                <div class="divBoton">
                    <button type="submit" class="botonPosteos">Publicar posteo</button>
                </div>
            </div>
        </form>
    </section>
</main>
</body>
</html>
